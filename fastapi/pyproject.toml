[tool.poetry]
name = "fausto-auth"
version = "0.1.0"
description = "Authentication service for Fausto platform"
authors = ["Aldo Richard Santillán Echevarría <richard.santillan@fausto.app>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/faustoapp/fausto-auth"
keywords = ["fastapi", "auth", "jwt", "redis", "sqlalchemy"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
PyJWT = "^2.10"
requests = "^2.32"
python-dotenv = "^1.0"
gunicorn = "^22.0"
psycopg2-binary = "^2.9"
sqlalchemy = "^1.3"
redis = "^5.0"
pydantic_sqlalchemy = "^0.0.9"
setuptools = "^80.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27"
black = "^24.0"
isort = "^5.13"
ruff = "^0.5"
pre-commit = "*"
commitizen = "*"
[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
ignore = ["E712","E711","F403"]
