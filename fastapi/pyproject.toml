[tool.poetry]
name = "fausto-auth"
version = "0.1.0"
description = "Authentication service for Fausto platform"
authors = ["Aldo Richard Santillán Echevarría <richard.santillan@fausto.app>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/faustoapp/fausto-auth"
keywords = ["fastapi", "auth", "jwt", "redis", "sqlalchemy"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
PyJWT = "^2.10.1"
requests = "^2.32.3"
python-dotenv = "^1.0.1"
gunicorn = "^23.0.0"
psycopg2-binary = "^2.9.10"
sqlalchemy = "^2.0.36"
redis = { version = "^5.2.0", extras = ["hiredis"] }
setuptools = "^80.9.0"
watchfiles = "^1.1.1"
argon2-cffi = "^23.1.0"
passlib = { version = "^1.7.4", extras = ["argon2"] }
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
asyncpg = "^0.31.0"
pytest-cov = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
httpx = "^0.28.1"
black = "^24.10.0"
isort = "^5.13.2"
ruff = "^0.5.0"
pre-commit = "*"
commitizen = "*"
pytest-asyncio = "^1.3.0"
aiosqlite = "^0.21.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
ignore = ["E712","E711","F403"]
