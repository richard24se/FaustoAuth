[tool.poetry]
name = "fausto-auth"
version = "0.1.0"
description = "Authentication service for Fausto platform"
authors = ["Aldo Richard Santillán Echevarría <richard.santillan@fausto.app>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/faustoapp/fausto-auth"
keywords = ["fastapi", "auth", "jwt", "redis", "sqlalchemy"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
PyJWT = "^2.10"
requests = "^2.32"
python-dotenv = "^1.0"
gunicorn = "^22.0"
psycopg2-binary = "^2.9"
sqlalchemy = "^2.0"
redis = { version = "^5.0", extras = ["hiredis"] }
setuptools = "^80.9.0"
watchfiles = "^1.1.1"
argon2-cffi = "^23.1.0"
passlib = { version = "^1.7.4", extras = ["argon2"] }
pydantic = "2.12.4"
pydantic-settings = "^2.12.0"
asyncpg = "^0.31.0"
pytest-cov = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27"
black = "^24.0"
isort = "^5.13"
ruff = "^0.5"
pre-commit = "*"
commitizen = "*"
pytest-asyncio = "^0.23.7"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
ignore = ["E712","E711","F403"]
